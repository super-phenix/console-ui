<div class="flow">
  <div class="flow__app-logo" role="img" aria-label="Superphenix Logo"></div>

  <h1 class="flow__title">Inactive account</h1>

  <p class="flow__error-message">
    Your account is inactive and does not allow you to access the Console UI. If you believe this is an error, please
    contact a platform administrator.
  </p>

  <p class="flow__error-message">
    You can send an email to <a [href]="'mailto:' + supportEmail">{{ supportEmail }}</a>
  </p>

  <div class="flow__links">
    <div class="flow__link">
      <button matButton="filled" (click)="logout()">Sign in with another account</button>
    </div>
    <div class="flow__link">
      <a matButton="text" routerLink="/dashboard">Back to home</a>
    </div>
  </div>
</div>
