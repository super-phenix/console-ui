replicaCount: 1

image:
  repository: ghcr.io/super-phenix/superphenix-console
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  {}
  # fsGroup: 2000

securityContext:
  {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80

# Nginx listen port need to match with service.port value
config:
  nginxConf: ""
  production: true
  appName: "Superphenix Console"

  # Required: The API domain (without protocol), e.g. "api.superphenix.net"
  apiUrl: ""

  # Auth UI base URL
  authUrl: "https://login.console.example.org"

  ssl: true
  sessionAutoRenew: 10
  supportEmail: "support@example.org"

  # Help links displayed in the UI.
  # Each entry is a key/value pair: key is the link name, value contains icon (Material icon name), text, and url.
  helpLinks:
    documentation:
      icon: "docs"
      text: "Documentation"
      url: "https://docs.superphenix.net"

  # Optional: Override the built-in theme-override.css
  # If empty, the built-in theme-override.css from the Docker image is used.
  # If set, it replaces the built-in file via configmap mount.
  # Example:
  #   themeOverride: |-
  #     :root {
  #       --accent-blue-500: #1e88e5;
  #     }
  themeOverride: ""

ingress:
  enabled: false
  annotations:
    {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  #hosts:
  #  - host: chart-example.local
  #    paths:
  #    - path: /
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

livenessProbe:
  httpGet:
    path: /
    port: http
readinessProbe:
  httpGet:
    path: /
    port: http

nodeSelector: {}

tolerations: []

affinity: {}
