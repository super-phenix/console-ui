# the events block is required
events{}

http {
    # include the default mime.types to map file extensions to MIME types
    include /etc/nginx/mime.types;

    server {
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;

      listen 80;
      # set the root directory for the server (we need to copy our
      # application files here)
      root /usr/share/nginx/html;

      # set the default index file for the server (Angular generates the
      # index.html file for us and it will be in the above directory)
      index index.html;

      # Don't cache index.html so new deployments are picked up
      location = /index.html {
          add_header Cache-Control "no-cache" always;
          try_files $uri /index.html;
      }

      # Don't cache environment.js so config changes are picked up
      location = /environment.js {
          types { }
          default_type "text/javascript; charset=utf-8";
          add_header Cache-Control "no-cache" always;
      }

      location ~* \.js$ {
        types { }
        default_type "text/javascript; charset=utf-8";
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
      }

      # Cache fingerprinted static assets (JS, CSS, fonts) for 1 year
      location ~* \.(css|woff2?|ttf|eot)$ {
          expires 1y;
          add_header Cache-Control "public, immutable" always;
          access_log off;
      }

      # specify the configuration for the '/' location
      location / {
          # try to serve the requested URI. if that fails then try to
          # serve the URI with a trailing slash. if that fails, then
          # serve the index.html file; this is needed in order to serve
          # Angular routes--e.g.,'localhost:8080/customer' will serve
          # the index.html file
          try_files $uri $uri/ /index.html;
      }
    }
}
